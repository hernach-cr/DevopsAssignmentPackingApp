name: CD


on:
  push:
    branches: [main]


concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     
      id-token: write    
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: ${{ github.sha }}
      RG: ${{ vars.RESOURCE_GROUP }}
      PREFIX: ${{ vars.PREFIX }}
      SQL_HOST: ${{ vars.SQL_SERVER }}.database.windows.net
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trips
        uses: docker/build-push-action@v6
        with:
          context: services/trips
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/packwise-trips:${{ env.TAG }}
      - name: Build and push packs
        uses: docker/build-push-action@v6
        with:
          context: services/packs
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/packwise-packs:${{ env.TAG }}


      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the UI origin (storage static website, without the final slash)
        run: |
          WEB=$(az storage account show -n ${{ vars.UI_STORAGE }} -g $RG --query primaryEndpoints.web -o tsv)
          echo "UI_ORIGIN=${WEB%/}" >> "$GITHUB_ENV"

      
      - name: Deploy trips
        run: |
          az containerapp secret set -n $PREFIX-trips -g $RG \
            --secrets database-url="mssql://trips_user:${{ secrets.TRIPS_DB_PASSWORD }}@$SQL_HOST:1433/$PREFIX-trips-db"
          az containerapp update -n $PREFIX-trips -g $RG \
            --image $REGISTRY/packwise-trips:$TAG \
            --set-env-vars DATABASE_URL=secretref:database-url PACKS_URL=${{ vars.PACKS_URL }} UI_ORIGIN=$UI_ORIGIN GIT_SHA=$TAG
      - name: Deploy packs
        run: |
          az containerapp secret set -n $PREFIX-packs -g $RG \
            --secrets database-url="mssql://packs_user:${{ secrets.PACKS_DB_PASSWORD }}@$SQL_HOST:1433/$PREFIX-packs-db"
          az containerapp update -n $PREFIX-packs -g $RG \
            --image $REGISTRY/packwise-packs:$TAG \
            --set-env-vars DATABASE_URL=secretref:database-url TRIPS_URL=${{ vars.TRIPS_URL }} UI_ORIGIN=$UI_ORIGIN GIT_SHA=$TAG


      - name: Write ui/config.js
        run: |
          cat > ui/config.js <<EOF
          window.CONFIG = {
            TRIPS_URL: "${{ vars.TRIPS_URL }}",
            PACKS_URL: "${{ vars.PACKS_URL }}",
          };
          EOF
          cat ui/config.js
      - name: Upload the UI
        run: |
          az storage blob upload-batch --account-name ${{ vars.UI_STORAGE }} --auth-mode key \
            --destination '$web' --source ui --overwrite

      - name: Health check
        run: |
          for i in $(seq 1 36); do
            T=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 ${{ vars.TRIPS_URL }}/health || true)
            P=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 ${{ vars.PACKS_URL }}/health || true)
            echo "Attempt $i/36: trips=$T packs=$P"
            if [ "$T" = "200" ] && [ "$P" = "200" ]; then
              curl -s ${{ vars.TRIPS_URL }}/health; echo
              curl -s ${{ vars.PACKS_URL }}/health; echo
              exit 0
            fi
            sleep 10
          done
          echo "The services did not return 200 on /health in time"
          exit 1
