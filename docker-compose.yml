services:
  trips:
    build: ./services/trips
    ports: ["5001:5001"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: sqlserver
      DB_USER: trips_user
      DB_PASSWORD: ${TRIPS_DB_PASSWORD}
      DB_NAME: trips
      PACKS_URL: http://packs:5002
      UI_ORIGIN: http://localhost:5500

  packs:
    build: ./services/packs
    ports: ["5002:5002"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: sqlserver
      DB_USER: packs_user
      DB_PASSWORD: ${PACKS_DB_PASSWORD}
      DB_NAME: packs
      TRIPS_URL: http://trips:5001
      UI_ORIGIN: http://localhost:5500

  ui:
    image: nginx:1.27-alpine
    ports: ["5500:80"]
    volumes:
      - ./ui:/usr/share/nginx/html:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 20
      start_period: 20s


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TRIPS_DB_PASSWORD: ${TRIPS_DB_PASSWORD}
      PACKS_DB_PASSWORD: ${PACKS_DB_PASSWORD}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -v TRIPS_PWD=\"$$TRIPS_DB_PASSWORD\" PACKS_PWD=\"$$PACKS_DB_PASSWORD\" -i /db/init.sql"]