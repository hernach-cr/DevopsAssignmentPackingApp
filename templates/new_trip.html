{% extends "base.html" %}
{% block content %}
<h2>Plan a trip</h2>
<p class="lede">Pick a destination and dates. You'll see a suggested packing list before anything is saved.</p>

<form id="trip-form">
    <label>Country <select id="country-select" required></select></label>
    <label>City <select id="city-select" required></select></label>
    <label>Start date <input type="date" name="start_date" required></label>
    <label>End date <input type="date" name="end_date" required></label>
    <label>Accommodation
        <select name="accommodation_type">
            <option value="hotel">Hotel</option>
            <option value="hostel">Hostel</option>
            <option value="apartment">Apartment</option>
            <option value="other">Other</option>
        </select>
    </label>
    <button type="submit">Generate packing list</button>
</form>
<p id="error-message"></p>

<div id="preview-section" class="preview" style="display:none;">
    <h3>Suggested packing list</h3>
    <div id="preview-climate" class="climate" style="display:none;"></div>
    <p id="preview-climate-note" class="climate-note"></p>
    <ul id="preview-items"></ul>
    <button id="save-trip-btn">Save trip</button>
    <button id="discard-btn" type="button" class="secondary">Discard</button>
</div>

<script>
async function loadCountries() {
    const response = await fetch("/api/countries");
    const countries = await response.json();
    const select = document.getElementById("country-select");
    select.innerHTML = '<option value="">Select a country</option>';
    countries.forEach(country => {
        const option = document.createElement("option");
        option.value = country;
        option.textContent = country;
        select.appendChild(option);
    });
}

async function loadCitiesForCountry(country) {
    const response = await fetch(`/api/cities?country=${encodeURIComponent(country)}`);
    const cities = await response.json();
    const select = document.getElementById("city-select");
    select.innerHTML = '<option value="">Select a city</option>';
    cities.forEach(c => {
        const option = document.createElement("option");
        option.value = c.city;
        option.textContent = c.city;
        select.appendChild(option);
    });
}

document.getElementById("country-select").addEventListener("change", function () {
    loadCitiesForCountry(this.value);
});

loadCountries();

document.querySelector('input[name="start_date"]').addEventListener("change", function () {
    document.querySelector('input[name="end_date"]').min = this.value;
});

let pendingTripData = null;

document.getElementById("trip-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    document.getElementById("error-message").textContent = "";
    const form = e.target;
    const data = {
        city: document.getElementById("city-select").value,
        country: document.getElementById("country-select").value,
        start_date: form.start_date.value,
        end_date: form.end_date.value,
        accommodation_type: form.accommodation_type.value,
    };

    const response = await fetch("/trips/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
    });

    if (!response.ok) {
        const err = await response.json();
        document.getElementById("error-message").textContent = err.error;
        return;
    }

    const result = await response.json();
    pendingTripData = data;
    const c = result.climate;
    const climateBox = document.getElementById("preview-climate");
    const rainText = c.precip_mm === null ? "n/a" : `${Math.round(c.precip_mm)} mm`;
    climateBox.innerHTML = "";
    [[`${c.avg_temp_c.toFixed(1)}°C`, c.temperature_label], [rainText, c.rain_label]].forEach(([value, label]) => {
        const item = document.createElement("div");
        item.className = "climate-item";
        const valueEl = document.createElement("span");
        valueEl.className = "climate-value";
        valueEl.textContent = value;
        const labelEl = document.createElement("span");
        labelEl.className = "climate-label";
        labelEl.textContent = label;
        item.append(valueEl, labelEl);
        climateBox.appendChild(item);
    });
    climateBox.style.display = "flex";
    document.getElementById("preview-climate-note").textContent = `Monthly averages for ${c.month_name}`;

    const list = document.getElementById("preview-items");
    list.innerHTML = "";
    result.items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.item_name} ×${item.quantity}`;
        list.appendChild(li);
    });

    document.getElementById("preview-section").style.display = "block";
});

document.getElementById("save-trip-btn").addEventListener("click", async function () {
    const response = await fetch("/trips", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pendingTripData),
    });
    const result = await response.json();
    window.location.href = "/trips/" + result.trip_id + "/view";
});

document.getElementById("discard-btn").addEventListener("click", function () {
    document.getElementById("preview-section").style.display = "none";
    pendingTripData = null;
document.getElementById("preview-climate").style.display = "none";
document.getElementById("preview-climate-note").textContent = "";
});
</script>
{% endblock %}
